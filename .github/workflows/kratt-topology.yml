name: KRATT Rust topology evidence

on:
  pull_request:
    paths:
      - "tools/kratt-topology/**"
      - ".github/workflows/kratt-topology.yml"
  push:
    branches:
      - "main"
      - "Forge.-9"
      - "feature/**"
    paths:
      - "tools/kratt-topology/**"
      - ".github/workflows/kratt-topology.yml"

permissions:
  contents: read

concurrency:
  group: kratt-topology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Compile and run deterministic tests
        run: cargo test --manifest-path tools/kratt-topology/Cargo.toml --all-targets
      - name: Static lint checks
        run: cargo clippy --manifest-path tools/kratt-topology/Cargo.toml --all-targets -- -D warnings
